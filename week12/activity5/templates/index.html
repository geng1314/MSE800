<!DOCTYPE html>
<html>
<head>
    <title>BMI Calculator</title> 
</head>
<body>
    <div class="container">
        <h1>BMI Calculator</h1> 
         {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <label>Weight in kilograms:</label><br>
            <input type="number" step="any" name="weight" required><br><br>
            <label>Height in meters:</label><br>
            <input type="number" step="0.1" name="height" required><br><br>
            <button type="submit">Calculate BMI</button>
        </form>
    </div>
</body>
</html>
